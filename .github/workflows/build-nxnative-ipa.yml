name: Build nxnative IPA (iPhone 13 Pro Max)

on:
  workflow_dispatch:
    inputs:
      game_folder:
        description: "Folder inside myprivaterepo containing the game's .xci/.nsp files"
        required: true
        type: string
        default: "SWITCH/ROMS"
      rom_selection:
        description: "Select the ROM to build"
        required: true
        type: choice
        options:
          - ANIMAL WELL
          - katana ZERO
        default: ANIMAL WELL
      prod_keys_path:
        description: "Path to prod.keys inside myprivaterepo"
        required: true
        type: string
        default: "SWITCH/KEYS/prod.keys"
      build_number:
        description: "App build number"
        required: true
        type: number
        default: 0
      dominant_color_styling:
        description: "Use the game's app-icon dominant color for launcher accents"
        required: true
        type: boolean
        default: true
      custom_accent_hex:
        description: "Custom launcher accent hex when dominant color styling is off (blank keeps nxnative defaults; e.g. #FF8800)"
        required: false
        type: string
        default: ""
      support_url:
        description: "Webpage opened by the launcher's Support button (blank hides the button)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA on Apple Silicon
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - name: Check out private game files and keys
        uses: actions/checkout@v4
        with:
          repository: SlyDevil6858/myprivaterepo
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          lfs: true
          path: private-game-data
          persist-credentials: false

      - name: Check out this nxnative fork
        uses: actions/checkout@v4
        with:
          ref: iphone-4gb
          path: nxnative
          persist-credentials: true

      - name: List ROM files and verify selected game file
        id: verify-input
        env:
          GAME_FOLDER: ${{ inputs.game_folder }}
          ROM_SELECTION: ${{ inputs.rom_selection }}
          PROD_KEYS_PATH: ${{ inputs.prod_keys_path }}
          DM_APP_BUILD: ${{ inputs.build_number }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = (Path(os.environ["GITHUB_WORKSPACE"]) / "private-game-data").resolve()
          game = (root / os.environ["GAME_FOLDER"]).resolve()
          keys = (root / os.environ["PROD_KEYS_PATH"]).resolve()
          selection = os.environ["ROM_SELECTION"].strip()
          expected_stems = {"ANIMAL WELL": "ANIMAL WELL", "katana ZERO": "katana ZERO"}
          if selection not in expected_stems:
              raise SystemExit(f"Unsupported ROM selection: {selection!r}")
          expected_stem = expected_stems[selection]

          def inside_root(path):
              return path == root or root in path.parents

          if not inside_root(game) or not game.is_dir():
              raise SystemExit("game_folder must be an existing folder inside myprivaterepo")
          if not inside_root(keys) or not keys.is_file():
              raise SystemExit("prod_keys_path must point to an existing file inside myprivaterepo")

          all_files = sorted((p for p in game.iterdir() if p.is_file()), key=lambda p: p.name.lower())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## Available files in " + os.environ["GAME_FOLDER"] + "\n\n")
              if all_files:
                  for path in all_files:
                      out.write(f"- {path.name} ({path.stat().st_size:,} bytes)\n")
              else:
                  out.write("No files found.\n")
              out.write("\nChoose **ANIMAL WELL** or **katana ZERO** from the ROM selection dropdown.\n")

          extensions = {".nsp", ".xci", ".nsz", ".xcz"}
          rom_files = [p for p in all_files if p.suffix.lower() in extensions and p.stat().st_size > 0]
          print("Files found in ROM folder:")
          for path in all_files:
              print(f"  {path.name} ({path.stat().st_size:,} bytes)")
          if not rom_files:
              raise SystemExit("No non-empty .nsp, .xci, .nsz or .xcz files found directly inside game_folder")

          # Match the selected game title to the exact ROM filename in the private repo.
          matches = [p for p in rom_files if p.stem == expected_stem]
          if len(matches) != 1:
              available = ", ".join(p.name for p in rom_files)
              raise SystemExit(
                  f"Could not uniquely find the ROM for '{selection}' in {os.environ['GAME_FOLDER']}. "
                  f"Expected '{expected_stem}' with a supported ROM extension. "
                  f"Available ROMs: {available or '(none)'}"
              )
          selected = matches[0]
          rom_name = selection
          ipa_name = "_".join(rom_name.split())
          override_folder = selected.stem
          if not override_folder or any(c in override_folder for c in "\r\n"):
              raise SystemExit("The selected ROM filename cannot be used as an override folder name.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"ipa_name={ipa_name}\n")
              output.write(f"rom_name={rom_name}\n")
              output.write(f"rom_file={selected.name}\n")
              output.write(f"override_folder={override_folder}\n")
              output.write("list_only=false\n")

          print(f"Selected ROM: {selected.name}")
          print(f"Initial IPA filename: {ipa_name}_A15_<version>_<build>.ipa")
          print("prod.keys file exists; its contents will not be printed or uploaded.")

      - name: Select ROM-matched launcher appearance and accent color
        if: steps.verify-input.outputs.list_only != 'true'
        working-directory: nxnative
        env:
          OVERRIDE_FOLDER: ${{ steps.verify-input.outputs.override_folder }}
          OVERRIDES_ROOT: ${{ github.workspace }}/nxnative/OVERRIDES
          DOMINANT_COLOR_STYLING: ${{ inputs.dominant_color_styling }}
          CUSTOM_ACCENT_HEX: ${{ inputs.custom_accent_hex }}
          SUPPORT_URL: ${{ inputs.support_url }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlsplit

          overrides_root = Path(os.environ["OVERRIDES_ROOT"]).resolve()
          rom_stem = os.environ["OVERRIDE_FOLDER"]
          if not rom_stem or rom_stem in {".", ".."} or "/" in rom_stem or "\\" in rom_stem or any(c in rom_stem for c in "\r\n"):
              raise SystemExit("The selected ROM filename cannot be used as an override folder name.")

          # Every ROM gets its own matching override directory. Keep a placeholder
          # in newly created folders so XcodeGen can bundle the directory resource.
          folder = (overrides_root / rom_stem).resolve()
          if folder.parent != overrides_root:
              raise SystemExit("The selected ROM filename produced an invalid override path.")
          if not folder.exists():
              folder.mkdir(parents=True, exist_ok=True)
              (folder / "README.md").write_text("ROM-matched override folder. Add ICON.png and BACKGROUND.png here. Put the touch theme in a nested folder named exactly like this ROM folder, e.g. ANIMAL WELL/theme.json.\n", encoding="utf-8")
              print(f"Created OVERRIDES/{rom_stem}/ for this ROM.")
          elif not folder.is_dir():
              raise SystemExit(f"Override path exists but is not a folder: OVERRIDES/{rom_stem}")

          support_url = os.environ.get("SUPPORT_URL", "").strip()
          if support_url:
              if any(c in support_url for c in "\r\n"):
                  raise SystemExit("support_url must be a single-line HTTP or HTTPS URL.")
              parsed_support_url = urlsplit(support_url)
              if parsed_support_url.scheme.lower() not in {"http", "https"} or not parsed_support_url.hostname:
                  raise SystemExit("support_url must be a complete HTTP or HTTPS webpage URL.")

          dominant_enabled = os.environ.get("DOMINANT_COLOR_STYLING", "true").lower() == "true"
          custom_hex = os.environ.get("CUSTOM_ACCENT_HEX", "").strip()
          normalized_hex = ""
          if not dominant_enabled and custom_hex:
              if not re.fullmatch(r"#?[0-9a-fA-F]{6}", custom_hex):
                  raise SystemExit("custom_accent_hex must be blank or a six-digit hex colour such as #FF8800.")
              normalized_hex = custom_hex if custom_hex.startswith("#") else f"#{custom_hex}"

          env_path = os.environ["GITHUB_ENV"]
          with open(env_path, "a", encoding="utf-8") as env:
              env.write(f"NXNATIVE_CUSTOM_ACCENT_HEX={normalized_hex}\n")
              env.write(f"NXNATIVE_OVERRIDE_FOLDER={rom_stem}\n")
              env.write(f"NXNATIVE_SUPPORT_URL={support_url}\n")

          if dominant_enabled:
              print("Dominant-colour styling is enabled; custom accent input will be ignored.")
          elif normalized_hex:
              print(f"Using custom launcher accent colour {normalized_hex}.")
          else:
              print("No custom launcher accent colour supplied; nxnative's default styling will be used.")

          icon = folder / "ICON.png"
          background = folder / "BACKGROUND.png"
          if icon.is_file():
              with open(env_path, "a", encoding="utf-8") as env:
                  env.write(f"NXNATIVE_CUSTOM_ICON={icon}\n")
          if background.is_file():
              with open(env_path, "a", encoding="utf-8") as env:
                  env.write(f"NXNATIVE_CUSTOM_BACKGROUND={background}\n")
          print(f"Using ROM-matched override directory OVERRIDES/{rom_stem}/")
          print("Missing override images are optional; nxnative will use its built-in defaults for those assets.")
          PY

      - name: Commit newly created ROM override folder
        if: steps.verify-input.outputs.list_only != 'true' && steps.verify-input.outputs.override_folder != ''
        working-directory: nxnative
        env:
          OVERRIDE_FOLDER: ${{ steps.verify-input.outputs.override_folder }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          override_path="OVERRIDES/$OVERRIDE_FOLDER"
          if [ ! -d "$override_path" ]; then
            echo "::error::Expected ROM override folder was not created: $override_path"
            exit 1
          fi

          git add -- "$override_path"
          if git diff --cached --quiet; then
            echo "The ROM-matched override folder already exists in the repository; nothing to commit."
            exit 0
          fi

          git commit -m "Add override folder for $OVERRIDE_FOLDER"
          git push origin HEAD:iphone-4gb
          echo "Committed and pushed $override_path to the iphone-4gb branch."

      - name: Verify macOS and Xcode
        if: steps.verify-input.outputs.list_only != 'true'
        run: |
          test "$(uname -s)" = "Darwin"
          command -v xcodebuild
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain
          xcodebuild -downloadPlatform iOS

      - name: Install native build tools
        if: steps.verify-input.outputs.list_only != 'true'
        run: |
          brew install xcodegen zstd glslang
          if ! dotnet --list-runtimes 2>/dev/null | grep -q 'Microsoft.NETCore.App 10\.'; then
            brew install --cask dotnet-sdk
          fi
          dotnet --list-runtimes

      - name: Set up arm64 Python
        if: steps.verify-input.outputs.list_only != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: arm64

      - name: Install Python dependencies
        if: steps.verify-input.outputs.list_only != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow lz4 "capstone>=5,<6" fonttools nsz zbic "backports.zstd; python_version < '3.14'"

      - name: Build IPA for a 6 GB iPhone
        if: steps.verify-input.outputs.list_only != 'true'
        id: build-ipa
        env:
          GAME_FOLDER: ${{ inputs.game_folder }}
          ROM_FILE: ${{ steps.verify-input.outputs.rom_file }}
          DM_SELECTED_ROM_FILE: ${{ steps.verify-input.outputs.rom_file }}
          PROD_KEYS_PATH: ${{ inputs.prod_keys_path }}
          DM_APP_BUILD: ${{ inputs.build_number }}
          DM_ICON: ${{ env.NXNATIVE_CUSTOM_ICON }}
          DM_LAUNCHER_BACKGROUND: ${{ env.NXNATIVE_CUSTOM_BACKGROUND }}
          DM_OVERRIDE_FOLDER: ${{ env.NXNATIVE_OVERRIDE_FOLDER }}
          DM_SHOW_FPS: "0"
          DM_DOMINANT_ACCENT: ${{ inputs.dominant_color_styling }}
          DM_CUSTOM_ACCENT_HEX: ${{ env.NXNATIVE_CUSTOM_ACCENT_HEX }}
          DM_SUPPORT_URL: ${{ env.NXNATIVE_SUPPORT_URL }}
        run: |
          set -o pipefail
          DATA_ROOT="$GITHUB_WORKSPACE/private-game-data"
          GAME_DIR="$RUNNER_TEMP/selected-rom"
          mkdir -p "$GAME_DIR"
          python3 - "$DATA_ROOT/$GAME_FOLDER" "$GAME_DIR" "$ROM_FILE" <<'PY'
          import os
          import sys
          from pathlib import Path

          source_dir, staging_dir, selected_name = map(Path, sys.argv[1:])
          extensions = {".nsp", ".xci", ".nsz", ".xcz"}
          selected = source_dir / selected_name
          if not selected.is_file() or selected.suffix.lower() not in extensions:
              raise SystemExit(f"Selected package is missing or unsupported: {selected_name}")
          packages = sorted(
              (p for p in source_dir.iterdir() if p.is_file() and p.suffix.lower() in extensions and p.stat().st_size > 0),
              key=lambda p: p.name.lower(),
          )
          if selected not in packages:
              raise SystemExit(f"Selected package is not in the package list: {selected_name}")
          for package in packages:
              os.symlink(package.resolve(), staging_dir / package.name)
          print(f"Staged {len(packages)} package link(s) without duplicating their data.")
          print(f"Selected game anchor: {selected_name}")
          PY
          KEYS_FILE="$DATA_ROOT/$PROD_KEYS_PATH"
          BUILD_LOG="$RUNNER_TEMP/nxnative-build.log"
          BASE_IPA="$RUNNER_TEMP/${{ steps.verify-input.outputs.ipa_name }}.ipa"

          python nxnative/scripts/build_ipa_from_nsp.py "$GAME_DIR" \
            --keys "$KEYS_FILE" \
            --6gb \
            --out "$BASE_IPA" \
            --progress lines 2>&1 | tee "$BUILD_LOG"

          # nxnative reports the display version read from the game's NACP
          # control metadata (packed update first, then base-game metadata).
          GAME_VERSION="$(python3 - "$BUILD_LOG" <<'PY'
          import re
          import sys
          from pathlib import Path

          log = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          matches = re.findall(r"app name: .*?; version: ([^;\r\n]+); bundle ID:", log)
          if not matches:
              raise SystemExit("Could not read the game version from nxnative's build output.")
          version = matches[-1].strip()
          if not re.fullmatch(r"[A-Za-z0-9._+-]+", version):
              raise SystemExit(f"Game version contains unsupported filename characters: {version!r}")
          print(version)
          PY
          )"

          FINAL_STEM="${{ steps.verify-input.outputs.ipa_name }}_A15_${GAME_VERSION}_Build_${{ inputs.build_number }}"
          FINAL_IPA="$RUNNER_TEMP/$FINAL_STEM.ipa"
          RELEASE_TITLE="${FINAL_STEM//_/ }"
          mv "$BASE_IPA" "$FINAL_IPA"
          {
            echo "ipa_path=$FINAL_IPA"
            echo "release_title=$RELEASE_TITLE"
          } >> "$GITHUB_OUTPUT"
          echo "Final IPA filename: $(basename "$FINAL_IPA")"
          echo "Matching release title: $RELEASE_TITLE"

      - name: Commit generated ROM touch theme
        if: always() && steps.verify-input.outputs.list_only != 'true' && steps.verify-input.outputs.override_folder != ''
        working-directory: nxnative
        env:
          OVERRIDE_FOLDER: ${{ steps.verify-input.outputs.override_folder }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          override_path="OVERRIDES/$OVERRIDE_FOLDER"
          git add -- "$override_path"
          if git diff --cached --quiet; then
            echo "No generated ROM touch theme changes to commit."
            exit 0
          fi
          git commit -m "Generate touch theme for $OVERRIDE_FOLDER from game icon"
          git push origin HEAD:iphone-4gb
          echo "Committed generated touch theme in $override_path."

      - name: Upload IPA to a private release in myprivaterepo
        if: steps.verify-input.outputs.list_only != 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: SlyDevil6858/myprivaterepo
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          tag_name: nxnative-build-${{ github.run_id }}
          name: ${{ steps.build-ipa.outputs.release_title }}
          body: "Unsigned IPA built from the nxnative fork. This release is in the private myprivaterepo repository."
          files: ${{ steps.build-ipa.outputs.ipa_path }}
          fail_on_unmatched_files: true
          make_latest: false
