name: Build nxnative IPA (iPhone 13 Pro Max)

on:
  workflow_dispatch:
    inputs:
      game_folder:
        description: "Folder inside myprivaterepo containing the game's .xci/.nsp files"
        required: true
        type: string
        default: "ROM"
      prod_keys_path:
        description: "Path to prod.keys inside myprivaterepo"
        required: true
        type: string
        default: "KEYS/prod.keys"
      build_number:
        description: "App build number"
        required: true
        type: number
        default: 0
      override_folder:
        description: "Folder inside OVERRIDES to use for the app icon and launcher background (blank disables overrides)"
        required: false
        type: string
        default: "ANIMAL WELL"
      include_animal_well_theme:
        description: "Bundle the ANIMAL WELL touch controls theme"
        required: true
        type: boolean
        default: true
      include_classic_theme:
        description: "Bundle the CLASSIC touch controls theme"
        required: true
        type: boolean
        default: true
      include_forest_theme:
        description: "Bundle the FOREST touch controls theme"
        required: true
        type: boolean
        default: false
      dominant_color_styling:
        description: "Use the game's app-icon dominant color for launcher accents (off uses the default blue styling)"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA on Apple Silicon
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - name: Check out private game files and keys
        uses: actions/checkout@v4
        with:
          repository: SlyDevil6858/myprivaterepo
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          lfs: true
          path: private-game-data
          persist-credentials: false

      - name: Check out this nxnative fork
        uses: actions/checkout@v4
        with:
          ref: iphone-4gb
          path: nxnative
          persist-credentials: false

      - name: Configure bundled touch control themes
        working-directory: nxnative
        env:
          INCLUDE_ANIMAL_WELL: ${{ inputs.include_animal_well_theme }}
          INCLUDE_CLASSIC: ${{ inputs.include_classic_theme }}
          INCLUDE_FOREST: ${{ inputs.include_forest_theme }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          theme_root = Path("TouchControlThemes")
          selections = {
              "ANIMAL WELL": os.environ["INCLUDE_ANIMAL_WELL"].lower() == "true",
              "CLASSIC": os.environ["INCLUDE_CLASSIC"].lower() == "true",
              "FOREST": os.environ["INCLUDE_FOREST"].lower() == "true",
          }
          if not any(selections.values()):
              raise SystemExit("Select at least one built-in touch control theme to bundle.")

          for name, enabled in selections.items():
              folder = theme_root / name
              if not folder.is_dir() or not (folder / "theme.json").is_file():
                  raise SystemExit(f"Required built-in theme folder is missing or incomplete: {folder}")
              if not enabled:
                  import shutil
                  shutil.rmtree(folder)

          bundled = [name for name, enabled in selections.items() if enabled]
          print("Bundled touch control themes in TouchControlThemes/: " + ", ".join(bundled))
          PY

      - name: Select launcher appearance override folder
        working-directory: nxnative
        env:
          OVERRIDE_FOLDER: ${{ inputs.override_folder }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path.cwd().resolve()
          overrides_root = (root / "OVERRIDES").resolve()
          selected = os.environ.get("OVERRIDE_FOLDER", "").strip()

          if not selected:
              print("No appearance override folder selected; using the game's original icon and launcher background.")
              raise SystemExit(0)

          # Accept one folder name only; never allow absolute paths or traversal.
          if Path(selected).name != selected or selected in {".", ".."} or "/" in selected or "\\" in selected:
              raise SystemExit("override_folder must be the name of one folder inside OVERRIDES.")

          folder = (overrides_root / selected).resolve()
          if folder.parent != overrides_root or not folder.is_dir():
              available = sorted(p.name for p in overrides_root.iterdir() if p.is_dir()) if overrides_root.is_dir() else []
              raise SystemExit(f"Override folder '{selected}' was not found in OVERRIDES/. Available folders: {', '.join(available) or '(none)'}")

          icon = folder / "custom-icon.png"
          background = folder / "custom-background.png"
          missing = [str(p.relative_to(root)) for p in (icon, background) if not p.is_file()]
          if missing:
              raise SystemExit("Selected override folder is missing required PNG file(s): " + ", ".join(missing))

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"NXNATIVE_CUSTOM_ICON={icon}\n")
              env.write(f"NXNATIVE_CUSTOM_BACKGROUND={background}\n")
          print(f"Using appearance overrides from OVERRIDES/{selected}/")
          PY

      - name: Verify paths and required game files
        id: verify-input
        env:
          GAME_FOLDER: ${{ inputs.game_folder }}
          PROD_KEYS_PATH: ${{ inputs.prod_keys_path }}
          DM_APP_BUILD: ${{ inputs.build_number }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = (Path(os.environ["GITHUB_WORKSPACE"]) / "private-game-data").resolve()
          game = (root / os.environ["GAME_FOLDER"]).resolve()
          keys = (root / os.environ["PROD_KEYS_PATH"]).resolve()

          def inside_root(path):
              return path == root or root in path.parents

          if not inside_root(game) or not game.is_dir():
              raise SystemExit("game_folder must be an existing folder inside myprivaterepo")
          if not inside_root(keys) or not keys.is_file():
              raise SystemExit("prod_keys_path must point to an existing file inside myprivaterepo")

          extensions = {".nsp", ".xci", ".nsz", ".xcz"}
          packages = [
              p for p in game.iterdir()
              if p.is_file() and p.suffix.lower() in extensions and p.stat().st_size > 0
          ]
          if not packages:
              raise SystemExit("No non-empty .nsp, .xci, .nsz or .xcz files found directly inside game_folder")

          # Choose the base game ROM for the output name. Updates and DLC remain
          # available to nxnative in the folder, but should not name the app.
          xci = [p for p in packages if p.suffix.lower() == ".xci"]
          base_nsp = [
              p for p in packages
              if p.suffix.lower() in {".nsp", ".nsz"}
              and not any(word in p.stem.lower() for word in ("update", "patch", "dlc"))
          ]
          candidates = xci if xci else base_nsp
          if len(candidates) != 1:
              names = ", ".join(p.name for p in candidates) or "none"
              raise SystemExit(
                  "Could not identify one base ROM for the IPA filename. "
                  f"Candidates: {names}. Keep one base .xci, or one base .nsp/.nsz "
                  "alongside any update/DLC files."
              )
          # Replace dot separators in release-style ROM names with spaces.
          rom_name = " ".join(candidates[0].stem.replace(".", " ").split())
          if not rom_name.strip() or any(c in rom_name for c in "\r\n"):
              raise SystemExit("The base ROM filename is empty or invalid.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"ipa_name={rom_name}\n")

          print(f"Found {len(packages)} game package file(s).")
          print(f"Initial IPA filename: {rom_name}.ipa (the build step appends A15 and the metadata version)")
          print("prod.keys file exists; its contents will not be printed or uploaded.")
          PY

      - name: Verify macOS and Xcode
        run: |
          test "$(uname -s)" = "Darwin"
          command -v xcodebuild
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain
          xcodebuild -downloadPlatform iOS

      - name: Install native build tools
        run: |
          brew install xcodegen zstd glslang
          if ! dotnet --list-runtimes 2>/dev/null | grep -q 'Microsoft.NETCore.App 10\.'; then
            brew install --cask dotnet-sdk
          fi
          dotnet --list-runtimes

      - name: Set up arm64 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: arm64

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic "backports.zstd; python_version < '3.14'"

      - name: Build IPA for a 6 GB iPhone
        id: build-ipa
        env:
          GAME_FOLDER: ${{ inputs.game_folder }}
          PROD_KEYS_PATH: ${{ inputs.prod_keys_path }}
          DM_APP_BUILD: ${{ inputs.build_number }}
          DM_ICON: ${{ env.NXNATIVE_CUSTOM_ICON }}
          DM_LAUNCHER_BACKGROUND: ${{ env.NXNATIVE_CUSTOM_BACKGROUND }}
          DM_SHOW_FPS: "0"
          DM_DOMINANT_ACCENT: ${{ inputs.dominant_color_styling }}
        run: |
          set -o pipefail
          DATA_ROOT="$GITHUB_WORKSPACE/private-game-data"
          GAME_DIR="$DATA_ROOT/$GAME_FOLDER"
          KEYS_FILE="$DATA_ROOT/$PROD_KEYS_PATH"
          BUILD_LOG="$RUNNER_TEMP/nxnative-build.log"
          BASE_IPA="$RUNNER_TEMP/${{ steps.verify-input.outputs.ipa_name }}.ipa"

          python nxnative/scripts/build_ipa_from_nsp.py "$GAME_DIR" \
            --keys "$KEYS_FILE" \
            --6gb \
            --out "$BASE_IPA" \
            --progress lines 2>&1 | tee "$BUILD_LOG"

          # nxnative reports the display version read from the game's NACP
          # control metadata (packed update first, then base-game metadata).
          GAME_VERSION="$(python3 - "$BUILD_LOG" <<'PY'
          import re
          import sys
          from pathlib import Path

          log = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          matches = re.findall(r"app name: .*?; version: ([^;\r\n]+); bundle ID:", log)
          if not matches:
              raise SystemExit("Could not read the game version from nxnative's build output.")
          version = matches[-1].strip()
          if not re.fullmatch(r"[A-Za-z0-9._+-]+", version):
              raise SystemExit(f"Game version contains unsupported filename characters: {version!r}")
          print(version)
          PY
          )"

          FINAL_IPA="$RUNNER_TEMP/${{ steps.verify-input.outputs.ipa_name }} A15 v${GAME_VERSION} build${{ inputs.build_number }}.ipa"
          mv "$BASE_IPA" "$FINAL_IPA"
          echo "ipa_path=$FINAL_IPA" >> "$GITHUB_OUTPUT"
          echo "Final IPA filename: $(basename "$FINAL_IPA")"

      - name: Upload IPA to a private release in myprivaterepo
        uses: softprops/action-gh-release@v2
        with:
          repository: SlyDevil6858/myprivaterepo
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          tag_name: nxnative-build-${{ github.run_id }}
          name: nxnative iPhone 13 Pro Max build ${{ inputs.build_number }}
          body: "Unsigned IPA built from the nxnative fork. This release is in the private myprivaterepo repository."
          files: ${{ steps.build-ipa.outputs.ipa_path }}
          fail_on_unmatched_files: true
          make_latest: false
