name: Convert default touch skin SVGs to PNGs

on:
  push:
    branches:
      - iphone-4gb
    paths:
      - .github/workflows/convert-touch-skin-pngs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: iphone-4gb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SVG renderer
        run: python -m pip install --upgrade pip cairosvg

      - name: Convert all default SVG assets to transparent PNGs
        run: |
          python - <<'PY'
          from pathlib import Path
          import cairosvg

          source = Path("dm/ios/TouchControlSkins/Default")
          output = Path("dm/ios/TouchControlSkins/Default-PNG")
          output.mkdir(parents=True, exist_ok=True)

          files = sorted(source.glob("*.svg"))
          if len(files) != 21:
              raise SystemExit(f"Expected 21 SVG assets, found {len(files)}")

          for svg in files:
              cairosvg.svg2png(
                  url=str(svg),
                  write_to=str(output / f"{svg.stem}.png"),
                  output_width=256,
                  output_height=256,
              )

          print(f"Converted {len(files)} SVG assets.")
          PY

      - name: Commit generated PNG assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dm/ios/TouchControlSkins/Default-PNG
          if git diff --cached --quiet; then
            echo "No generated PNG changes."
          else
            git commit -m "Add PNG copy of default touch control skin"
            git push origin HEAD:iphone-4gb
          fi
