<svg xmlns="http://www.w3.org/2000/svg" width="896" height="414" viewBox="0 0 896 414">
  <title>Default touch controls — 3D skin template</title>
  <desc>Editable landscape template based on the built-in NXNative touch controls. Keep the transparent canvas and control positions; export as skin-3d.png.</desc>
  <defs>
    <style>
      .key{fill:#fff;fill-opacity:.14;stroke:#fff;stroke-opacity:.38;stroke-width:1.5}
      .ring{fill:#fff;fill-opacity:.06;stroke:#fff;stroke-opacity:.38;stroke-width:1.5}
      .txt{font-family:Arial,sans-serif;font-size:18px;font-weight:bold;fill:#fff;fill-opacity:.6;text-anchor:middle;dominant-baseline:central}
      .small{font-size:15px}.swap{font-size:12px}
    </style>
  </defs>
  <!-- Left stick -->
  <circle class="ring" cx="100" cy="313" r="74"/>
  <circle class="key" cx="100" cy="313" r="29"/>
  <circle cx="100" cy="313" r="18" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="1.5"/>
  <!-- Face-button diamond -->
  <circle class="key" cx="748" cy="313" r="26"/><text class="txt" x="748" y="313">Y</text>
  <circle class="key" cx="796" cy="265" r="26"/><text class="txt" x="796" y="265">X</text>
  <circle class="key" cx="796" cy="361" r="26"/><text class="txt" x="796" y="361">B</text>
  <circle class="key" cx="844" cy="313" r="26"/><text class="txt" x="844" y="313">A</text>
  <!-- D-pad -->
  <path class="key" d="M249 267 L283 267 L283 298 L266 315 L249 298Z"/>
  <path class="key" d="M283 300 L314 300 L314 334 L283 334 L266 317Z"/>
  <path class="key" d="M249 334 L283 334 L283 365 L249 365 L266 348Z"/>
  <path class="key" d="M218 300 L249 300 L266 317 L249 334 L218 334Z"/>
  <!-- Shoulder and trigger buttons -->
  <path class="key" d="M65 28 Q66 14 83 14 Q106 14 106 37 Q99 59 77 65 Q63 53 65 28Z"/><text class="txt small" x="84" y="39">ZL</text>
  <rect class="key" x="63" y="83" width="46" height="46" rx="23"/><text class="txt small" x="86" y="106">L</text>
  <path class="key" d="M831 28 Q830 14 813 14 Q790 14 790 37 Q797 59 819 65 Q833 53 831 28Z"/><text class="txt small" x="812" y="39">ZR</text>
  <rect class="key" x="787" y="83" width="46" height="46" rx="23"/><text class="txt small" x="810" y="106">R</text>
  <!-- Stick clicks -->
  <circle class="key" cx="142" cy="39" r="16"/><text class="txt small" x="142" y="39">L3</text>
  <circle class="key" cx="754" cy="39" r="16"/><text class="txt small" x="754" y="39">R3</text>
  <!-- Minus / layout / plus -->
  <rect class="key" x="370" y="8" width="50" height="28" rx="14"/><text class="txt" x="395" y="22">−</text>
  <circle class="key" cx="448" cy="22" r="15"/><text class="txt swap" x="448" y="22">3D</text>
  <rect class="key" x="476" y="8" width="50" height="28" rx="14"/><text class="txt" x="501" y="22">+</text>
</svg>