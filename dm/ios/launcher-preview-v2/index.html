<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Game Launcher — Accurate Preview</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="launcher">
    <aside class="game-pane">
      <div class="game-details">
        <div class="game-icon" aria-label="Animal Well app icon preview">
          <span class="icon-art"></span>
          <span class="icon-title">ANIMAL WELL</span>
        </div>
        <h1>ANIMAL WELL</h1>
        <p class="version">Version 1.0.0</p>
        <button class="play-button" type="button">Play</button>
      </div>
    </aside>

    <section class="settings-pane" aria-label="Launcher settings">
      <h2 class="group-title first-title">Game</h2>
      <section class="settings-card" aria-label="Game settings">
        <div class="setting-row has-note">
          <div class="setting-label">
            <span class="name">Console mode</span>
            <span class="note">Set by an env file</span>
          </div>
          <select class="picker locked" aria-label="Console mode" disabled>
            <option>Handheld</option>
          </select>
        </div>
        <div class="setting-row has-note">
          <div class="setting-label">
            <span class="name">Upscaling</span>
            <span class="note">Uses more GPU time and can increase heat.</span>
          </div>
          <select class="picker" aria-label="Upscaling">
            <option>Standard</option>
            <option>Off</option>
            <option>High</option>
          </select>
        </div>
        <div class="setting-row">
          <div class="setting-label"><span class="name">Game language</span></div>
          <select class="picker" aria-label="Game language">
            <option>American English</option>
            <option>British English</option>
            <option>Japanese</option>
          </select>
        </div>
        <div class="setting-row">
          <div class="setting-label"><span class="name">Frame-rate counter</span></div>
          <button class="ios-switch on" role="switch" aria-checked="true" aria-label="Frame-rate counter"><span></span></button>
        </div>
      </section>

      <h2 class="group-title">Controls</h2>
      <section class="settings-card" aria-label="Controls settings">
        <div class="setting-row">
          <div class="setting-label"><span class="name">Touch feedback</span></div>
          <button class="ios-switch on" role="switch" aria-checked="true" aria-label="Touch feedback"><span></span></button>
        </div>
        <div class="setting-row">
          <div class="setting-label"><span class="name">Game rumble</span></div>
          <button class="ios-switch on" role="switch" aria-checked="true" aria-label="Game rumble"><span></span></button>
        </div>
      </section>
      <p class="preview-caption">Visual replica based on the supplied launcher screenshot. Controls are for preview only.</p>
    </section>
  </main>
  <script>
    document.querySelectorAll('.ios-switch').forEach((toggle) => {
      toggle.addEventListener('click', () => {
        const next = toggle.getAttribute('aria-checked') !== 'true';
        toggle.setAttribute('aria-checked', String(next));
        toggle.classList.toggle('on', next);
      });
    });
  </script>
</body>
</html>
